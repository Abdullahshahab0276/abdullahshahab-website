- slug: beauty-wellness
  name: Beauty & Wellness
  h1: "Brand identity design for skincare, beauty and wellness brands"
  title: "Skincare & Beauty Brand Identity Design | Shahab"
  description: "Human-designed brand identities for skincare, beauty, spa and wellness brands: logo, packaging, guidelines and social kit. First brand board in 48 hours, from $250."
  keywords: [beauty, skincare, cosmetic, spa, wellness, mental, pilates]
  gradient: g-rose
  intro: >-
    In beauty and wellness, people buy with their eyes before they ever try the product. Your brand
    has to feel premium on a shelf, calm on a screen and trustworthy in someone's bathroom. I design
    complete identities for skincare lines, cosmetics, med spas, studios and wellness platforms,
    built to look as good on packaging as they do on Instagram.
  points:
    - ["Soft, confident colour", "Palettes that feel clean and premium, with one accent used with restraint."]
    - ["Packaging that photographs well", "Labels and boxes designed for the shelf, the unboxing and the product shot."]
    - ["Typography with breathing room", "Elegant type and generous spacing, so the brand never feels crowded."]
    - ["One look across every product", "A system that keeps a growing range of SKUs consistent without feeling repetitive."]
  faqs:
    - ["Can you design packaging for my skincare or beauty range?", "Yes. Packaging and merchandising are included in The Brand Ecosystem package, and the Basic and Premium packages include 3D mockups of your brand on real products. For a large range, I'll put together a custom quote."]
    - ["Do you work with spas, salons and wellness studios too?", "Yes. The portfolio includes a med spa, a pilates studio, a mental wellbeing app and wellness lifestyle brands. The process is the same: a short brief call, research into your market, then your first full brand board in 48 hours."]
    - ["Will my brand work on Instagram as well as on packaging?", "That's the goal. From the Premium Branding package up you get a social media kit with profile assets and post templates in your new identity."]

- slug: food-drink
  name: Food & Drink
  h1: "Branding for cafés, restaurants and food & drink brands"
  title: "Café, Restaurant & Food Brand Identity Design | Shahab"
  description: "Human-designed branding for cafés, restaurants, breweries and food & drink products: logo, packaging, menus and social. First brand board in 48 hours."
  keywords: [food, drink, brew, coffee, café, cafe, dessert, beverage, fast food]
  gradient: g-orange
  intro: >-
    A food brand lives on cups, bags, menus, signs, delivery apps and staff t-shirts, often all in
    the same week. It needs personality people remember after one visit and a logo that still reads
    when it's printed small on a sticker. I design identities for cafés, restaurants, fast food,
    breweries and packaged food and drink brands.
  points:
    - ["A logo that works on cups and signs", "Simple, bold marks that stay readable from a distance and at sticker size."]
    - ["Personality people remember", "Playful type, mascots or patterns that give regulars something to recognise."]
    - ["Packaging that sells itself", "Bags, boxes, pouches and labels designed for the counter and the delivery app."]
    - ["Consistent menus and socials", "Templates so every menu update and post looks like the same brand."]
  faqs:
    - ["Can you design menus, cups and takeaway packaging?", "Yes. Packaging and merchandising are part of The Brand Ecosystem package, and every package includes mockups so you can see your brand on cups, bags and signage before printing anything."]
    - ["I'm opening a new café. When should I start the branding?", "Ideally before you order signage, cups or printed menus, so everything is produced once in the final design. The first brand board takes 48 hours, so branding rarely holds up an opening."]
    - ["Do you design for packaged food and drink products?", "Yes. The portfolio includes pet food, a brewery, a matcha drink brand and snack brands. Product packaging is included in The Brand Ecosystem or available as a custom quote."]

