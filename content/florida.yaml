  - slug: small-business-branding
    kw: "Small business branding in Florida"
    title: "Small Business Branding in Florida | From $250 | Shahab"
    description: "Affordable branding for Florida small businesses and new LLCs: logo, colours, guidelines and social kit. Sunbiz and trademark tips included."
    h1: "Small business branding for Florida founders"
    intro: "Florida has more than 3.4 million self-employed and non-employer businesses (Census, 2024), so a new business has to look credible from day one. I design affordable, professional brand identities for Florida small businesses and new LLCs, from $250."
    sections:
      - h2: "Branding checklist for a new Florida business"
        ul:
          - "Search your name on <a href=\"https://dos.fl.gov/sunbiz/\" target=\"_blank\" rel=\"noopener\">Sunbiz</a> (business entities and fictitious names) before you fall in love with it"
          - "If you trade under a name other than your legal or LLC name, file a <a href=\"https://dos.fl.gov/sunbiz/start-business/efile/fl-fictitious-name-registration/\" target=\"_blank\" rel=\"noopener\">fictitious name registration</a> ($50)"
          - "Check that the matching domain and Instagram handle are free"
          - "Design the logo and identity on the final name"
          - "Consider a Florida trademark ($87.50 per class, 5 years) or a federal USPTO trademark once the brand is in use"
      - h2: "What small businesses usually choose"
        p:
          - "Most Florida small businesses start with Premium ($450): three logo concepts, a full colour and type system, guidelines and a social kit. Sole traders testing an idea often start with Basic ($250)."
    faqs:
      - ["Does an LLC registration protect my business name in Florida?", "No. An LLC, corporation or fictitious name registration doesn't register the name as a trademark. Trademarks are a separate filing with the state or the USPTO."]
      - ["What's the cheapest professional branding for a Florida small business?", "My Basic package is $250 for a human-designed logo with colours, typography, mockups and simple guidelines, with source files and copyright."]
    links: ["/startup-branding/", "/pricing/", "/brand-guidelines/"]

  - slug: bilingual-branding
    kw: "Bilingual English Spanish branding in Florida"
    title: "Bilingual English-Spanish Branding in Florida | Shahab"
    description: "Brand identities for Florida businesses that serve English and Spanish speakers: names, taglines, type and guidelines that work in both languages."
    h1: "Bilingual branding for Florida businesses"
    intro: "About 30.6% of Floridians aged 5 and over speak a language other than English at home (Census, 2020–2024), and Spanish is by far the most common, followed by Haitian Creole and Portuguese. In cities like Hialeah and Doral the share is near 90%. I design identities that work for both audiences."
    sections:
      - h2: "What bilingual branding means in practice"
        ul:
          - "Names that are easy to say and spell in English and Spanish, and checked for unwanted meanings"
          - "Taglines written as pairs, not word-for-word translations"
          - "Fonts with full accent support (á, é, ñ, ü) at every weight"
          - "Guidelines that show how to set both languages on signage, menus and social posts"
      - h2: "Sources"
        p:
          - "<a href=\"https://www.census.gov/quickfacts/fact/table/FL/POP815222\" target=\"_blank\" rel=\"noopener\">US Census QuickFacts, Florida</a> and <a href=\"https://usafacts.org/answers/how-many-people-speak-a-language-other-than-english-at-home/state/florida/\" target=\"_blank\" rel=\"noopener\">USAFacts language data for Florida</a>."
    faqs:
      - ["Do you speak Spanish?", "I design in both languages and check copy with native speakers or with your team. For long marketing copy, I recommend a native copywriter."]
      - ["Should my Florida logo include Spanish text?", "Usually not. Keep the logo itself language-neutral and put bilingual taglines and messaging around it, so the mark works everywhere."]
