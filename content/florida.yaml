hub:
  title: "Logo & Brand Identity Designer in Florida | Shahab"
  description: "Human-designed logos and brand identities for Florida businesses in all 67 counties. Remote, fixed prices from $250, first brand board in 48 hours."
  h1: "Logo and brand identity design for Florida businesses"
  intro: "I design logos and complete brand identities for founders and small businesses across Florida, from Miami, Orlando and Tampa to Panhandle towns and the Keys. Everything is designed by me, by hand, delivered online, at fixed prices from $250, with a first brand board in 48 hours."
  facts:
    - ["Florida population (July 2025 estimate)", "23,462,518", "https://www.census.gov/quickfacts/fact/table/FL/POP815224"]
    - ["Self-employed and non-employer businesses (2024)", "3,427,341", "https://www.census.gov/quickfacts/fact/table/FL/POP815224"]
    - ["Employer firms (2023)", "500,294", "https://www.census.gov/quickfacts/fact/table/FL/POP815224"]
    - ["Speak a language other than English at home", "30.6%", "https://www.census.gov/quickfacts/fact/table/FL/POP815222"]
    - ["Florida state trademark filing fee", "$87.50 per class", "https://www.flsenate.gov/Laws/Statutes/2022/495.191"]
    - ["Fictitious name (DBA) registration fee", "$50", "https://dos.fl.gov/sunbiz/start-business/efile/fl-fictitious-name-registration/instructions/"]
  faqs:
    - ["Who designs logos for Florida small businesses?", "I'm Abdullah Shahab, an independent brand identity designer with 7 years of experience. I work remotely with Florida founders and small businesses in every county: every logo is designed by hand (no AI generators), priced from $250, with source files and full copyright included."]
    - ["How much does a logo cost in Florida?", "My prices are the same everywhere in Florida: $250 for a logo with colours, type, mockups and guidelines; $450 for three concepts, complete guidelines and a social kit; $1,050 for The Brand Ecosystem. Agency projects in Miami or Tampa commonly cost several thousand dollars for similar deliverables."]
    - ["Do I need to register my business name before designing a logo in Florida?", "If you trade under any name other than your own legal name or your LLC or corporation's registered name, Florida requires a fictitious name (DBA) registration with the Division of Corporations on Sunbiz. The fee is $50. It's worth checking Sunbiz and the trademark records before finalising a name, so the logo is built on a name you can keep."]
    - ["Can I trademark my logo in Florida?", "Yes. Florida registers trademarks and service marks with the Division of Corporations for $87.50 per class, and a registration lasts 5 years. A state registration covers Florida only; a federal USPTO registration covers the whole country. I don't file trademarks, but every logo I design is original and comes with clean files for the application."]
    - ["Can you design a bilingual English and Spanish brand?", "Yes. About 30.6% of Floridians speak a language other than English at home, mostly Spanish, so many Florida brands need a name, tagline and type system that work in both languages. I design type systems with full Spanish character support and test taglines in both languages."]
    - ["Do you meet Florida clients in person?", "No. I work remotely from Pakistan, and that's what keeps prices fixed and turnaround fast. Calls are booked on Calendly in Eastern or Central Time, and a brief sent at the end of your day is worked on overnight."]

