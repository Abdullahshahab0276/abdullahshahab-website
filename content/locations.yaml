  title: "Logo & Brand Identity Designer for US Businesses | Shahab"
  description: "Human-designed logos and brand identities for businesses across the USA. Remote, fixed prices in USD from $250, first brand board in 48 hours."
  h1: "Logo and brand identity design for businesses across the USA"
  intro: >-
    I design logos and complete brand identities for founders and small businesses in all 50 states,
    remotely. Prices are fixed in US dollars, calls are booked in your own time zone, and your first
    brand board arrives within 48 hours.
  sections:
    - h2: How does working with a remote brand designer work?
      p:
        - "Everything happens online: a short video call or written brief, concepts delivered as a brand board, feedback by email or WhatsApp, and final files by download. You never need to meet in person, and most founders prefer it: no commute, no meetings that run long, and a written record of every decision."
    - h2: What about time zones?
      p:
        - "I'm based in Pakistan (PKT, UTC+5), which is 9 to 13 hours ahead of the US depending on your zone and the season. Calls are booked through Calendly, which shows available times in your own time zone. The difference works in your favour: a brief sent at the end of your day is worked on during mine."
      table:
        - ["US time zone", "Hours behind Pakistan (PKT)"]
        - ["Eastern (New York, Miami)", "9–10 hours"]
        - ["Central (Chicago, Dallas, Austin)", "10–11 hours"]
        - ["Mountain (Denver, Phoenix)", "11–12 hours"]
        - ["Pacific (Los Angeles, Seattle)", "12–13 hours"]
    - h2: Pricing, contracts and trademarks for US clients
      ul:
        - "Fixed prices in US dollars: $250, $450 or $1,050, paid once."
        - "Scope, deliverables and timeline confirmed in writing before work starts; NDAs on request."
        - "Source files and copyright included, ready for a USPTO trademark filing by your attorney."
  faqs:
    - ["Do you work with clients in every US state?", "Yes. All work is remote, so location doesn't matter. Clients book a call, send a brief and receive files online."]
    - ["Do you charge in US dollars?", "Yes. All packages are priced in US dollars: $250, $450 and $1,050, paid once."]
    - ["Can my logo be trademarked in the US?", "I don't file trademarks, but every logo is original and human-designed, and you receive clean source files you can take to a trademark attorney for a USPTO filing."]
    - ["What time are calls?", "You choose a time on the Calendly booking page, which shows slots in your own time zone."]

