- slug: brand-guidelines
  name: Brand guidelines
  keyword: brand guidelines design
  title: "Brand Guidelines Design Service (Brand Style Guide) | Shahab"
  description: "Brand guidelines design: logo usage, colour codes, typography, imagery and do's and don'ts in one clear style guide. Included in every Shahab package."
  h1: "Brand guidelines design: one clear rulebook for your brand"
  kicker: Brand guidelines
  image: img/a022.jpg
  image_alt: Mavion brand guidelines
  intro: >-
    Brand guidelines (also called a brand style guide or brand book) tell everyone who touches your
    brand how to use it: which logo goes where, which colours and fonts to use, and what to avoid.
    Every package I design includes guidelines, so your brand stays consistent as your team grows.
  sections:
    - h2: What do brand guidelines include?
      ul:
        - "<b>Logo system:</b> primary logo, variations, clear space, minimum sizes and incorrect uses"
        - "<b>Colour palette:</b> primary and secondary colours with codes for print and screen"
        - "<b>Typography:</b> font pairings and how to use them for headings and body text"
        - "<b>Imagery and graphic styles:</b> photography direction, patterns and graphic elements"
        - "<b>Applications:</b> examples on stationery, social posts and mockups"
    - h2: Why does a business need brand guidelines?
      p:
        - "Without rules, a brand drifts: a stretched logo on one flyer, a different blue on the website, a new font on every post. Guidelines prevent that, and they make it easy to hand your brand to printers, developers, freelancers or a new hire."
        - "See real examples in the <a href=\"/work/mavion/\">Mavion brand guidelines</a> and <a href=\"/work/pingup/\">Pingup brand guidelines</a> case studies."
    - h2: Which packages include guidelines?
      p:
        - "The Basic plan includes brand guidelines. Premium Branding and The Brand Ecosystem include <b>complete</b> guidelines with logo usage rules, imagery and graphic styles. Already have a logo and only need guidelines? Send a message for a custom quote. Compare packages on the <a href=\"/pricing/\">pricing page</a>."
  faqs:
    - ["What is the difference between brand guidelines and a style guide?", "They are the same thing. Brand guidelines, brand style guide and brand book all describe the document that explains how to use your logo, colours, typography and imagery."]
    - ["What format are the guidelines delivered in?", "A PDF document you can share with your team, printers and partners, delivered with your logo files."]
    - ["Can you create guidelines for my existing logo?", "Yes, as a custom project. Send a message with your current files and I'll quote it."]
    - ["How long are the guidelines?", "As long as your brand needs. Every guide covers the logo, colour, typography and imagery; complete guidelines add usage rules and application examples."]
  related_posts: [brand-identity-checklist, logo-file-formats]
  related_cases: [mavion, pingup, ovenox]

