- slug: logo-design
  name: Logo design
  keyword: logo design services
  title: "Logo Design Services by a Human Designer | Shahab"
  description: "Custom logo design services from a real designer: up to 3 concepts, vector source files and full copyright. First concepts in 48 hours, from $250."
  h1: "Custom logo design services, designed by a person"
  kicker: Logo design
  image: img/a008.jpg
  image_alt: Ovenox logo construction grid
  intro: >-
    I design custom logos for founders and small businesses in the USA, UK and beyond. Every logo is
    researched, sketched and built by hand as a system that works on a favicon, a business card and a
    billboard. You see your first concepts in 48 hours, and you own the files and the copyright.
  sections:
    - h2: What do you get with a custom logo?
      p:
        - "A logo is more than one file. Every package delivers a logo you can actually use everywhere your business shows up:"
      ul:
        - "<b>Logo concepts:</b> 1 concept on the Basic plan, 3 distinct directions on Premium Branding and The Brand Ecosystem."
        - "<b>Vector source files</b> plus transparent PNGs and print-ready PDFs (see <a href=\"/blog/logo-file-formats/\">which logo file format to use</a>)."
        - "<b>Colour palette and typography</b> chosen to match the logo."
        - "<b>3D mockups and stationery</b> so you see the logo on real products before you print anything."
        - "<b>Brand guidelines</b> explaining how to use the logo correctly."
    - h2: Why choose a human logo designer over an AI logo maker?
      p:
        - "AI logo makers are fast, but they pull from the same shapes and fonts as thousands of other businesses, and there is no one to explain the thinking. A human designer starts from your market, your competitors and your customers."
        - "Ownership matters too. In the US, a purely AI-generated logo can't be registered for copyright, while a human-designed one can. I explain the details in <a href=\"/blog/can-you-copyright-an-ai-generated-logo/\">can you copyright an AI-generated logo?</a> Every logo I deliver is designed by me, so the copyright transfers to you with the files."
    - h2: How does logo design in 48 hours work?
      ul:
        - "<b>1. Brief:</b> a short call or brief about what you sell, who it's for and the look you want."
        - "<b>2. Concepts in 48 hours:</b> I research your industry and competitors, then deliver your first brand board with logo concepts, colours, type and mockups."
        - "<b>3. Refine and finalise:</b> revise until it feels right (2 revisions on Basic, 3 on Premium, unlimited on your chosen concept with The Brand Ecosystem), then receive every file."
      p:
        - "Basic and Premium packages are delivered in 2 days. The Brand Ecosystem, which adds strategy and marketing assets, takes 5 business days."
    - h2: What does a professional logo cost?
      p:
        - "Logo design prices range from free AI tools to agency projects of $10,000 or more. My packages are fixed and paid once: <b>$250</b> (Basic), <b>$450</b> (Premium Branding) and <b>$1,050</b> (The Brand Ecosystem). Compare every inclusion on the <a href=\"/pricing/\">branding packages page</a>, or read the full market breakdown in <a href=\"/blog/how-much-does-a-logo-cost/\">how much does a logo cost in 2026</a>."
    - h2: Logo design for your industry
      p:
        - "I design logos for <a href=\"/branding/tech-fintech/\">tech and fintech startups</a>, <a href=\"/branding/beauty-wellness/\">skincare and beauty brands</a>, <a href=\"/branding/food-drink/\">cafés and restaurants</a>, <a href=\"/branding/fashion-luxury/\">fashion and luxury labels</a> and <a href=\"/branding/sports/\">sports clubs</a>. Need more than a logo? See <a href=\"/brand-identity-design/\">brand identity design</a>."
  faqs:
    - ["How long does logo design take?", "Your first brand board with logo concepts arrives within 48 hours of the brief. Basic and Premium packages are completed in 2 days; The Brand Ecosystem takes 5 business days."]
    - ["How many logo concepts will I get?", "The Basic plan includes 1 logo concept. Premium Branding and The Brand Ecosystem include 3 distinct concepts so you can compare directions."]
    - ["Will I own the copyright to my logo?", "Yes. You receive the source files and the copyright. Because the logo is designed by a person rather than generated by AI, it can be protected by copyright."]
    - ["What file formats do I receive?", "Vector source files plus transparent PNG and print-ready PDF files, so the logo works on the web, in print and on social media."]
    - ["Do you use AI to design logos?", "No. Every concept is researched, drawn and refined by me. That is also what makes the copyright yours."]
    - ["Can you register my logo as a trademark?", "I don't file trademarks, but I supply clean, original source files that you can take to a trademark attorney or filing service."]
  related_posts: [how-much-does-a-logo-cost, logo-file-formats, can-you-copyright-an-ai-generated-logo]
  related_cases: [ovenox, voitex, pingup]

- slug: brand-identity-design
  name: Brand identity design
  keyword: brand identity design services
  title: "Brand Identity Design Services, From $250 | Shahab"
  description: "Complete brand identity design: logo system, colours, typography, guidelines, mockups and social kit. Human-designed, first brand board in 48 hours."
  h1: "Brand identity design services for founders who want to look established"
  kicker: Brand identity design
  image: img/a012.jpg
  image_alt: Voitex brand guidelines page
  intro: >-
    A brand identity is the whole visual system around your logo: colour, typography, imagery,
    guidelines and the assets you use every day. I design complete identities for startups and
    small businesses, from the first concept to the final files, with no agency layers in between.
  sections:
    - h2: What is included in a brand identity?
      p:
        - "A complete identity gives your business one consistent look on your website, packaging, social media and ads. Depending on the package, you receive:"
      ul:
        - "A logo system with concepts, variations and vector source files"
        - "A colour palette with codes for print and screen"
        - "Brand typography and imagery or graphic styles"
        - "Brand guidelines covering logo usage, colour, type and imagery"
        - "Stationery, 3D mockups and a social media kit (from Premium Branding)"
        - "Brand voice, marketing angles, ad creatives, packaging and UI assets (The Brand Ecosystem)"
      p2: "Use the <a href=\"/blog/brand-identity-checklist/\">brand identity checklist</a> to see what to ask any designer for."
    - h2: Who is this brand identity service for?
      ul:
        - "<b>New businesses</b> launching a product or service that needs to look credible from day one (see <a href=\"/startup-branding/\">startup branding</a>)."
        - "<b>Growing businesses</b> whose current look no longer matches the quality of what they sell (see <a href=\"/rebranding/\">rebranding</a>)."
        - "<b>Founders who want one designer</b> from brief to final files instead of an agency team."
    - h2: How is the identity designed?
      p:
        - "Every project starts with research into your market and competitors. I then build the logo, choose the colours and typography, and test the system on real applications: business cards, packaging, signage, app screens and social posts. Your first full brand board arrives within 48 hours, and we refine it together until it feels right."
        - "See finished identities in the <a href=\"/work/voitex/\">Voitex</a>, <a href=\"/work/ovenox/\">Ovenox</a>, <a href=\"/work/mavion/\">Mavion</a> and <a href=\"/work/pingup/\">Pingup</a> case studies."
    - h2: How much does brand identity design cost?
      p:
        - "My brand identity packages are fixed, one-time prices: $250, $450 and $1,050. Agencies typically charge several thousand dollars for a similar scope, mostly because of overhead. Compare the packages side by side on the <a href=\"/pricing/\">pricing page</a>."
  faqs:
    - ["What is the difference between a logo and a brand identity?", "A logo is one mark. A brand identity is the full system around it: colours, typography, imagery, guidelines and the assets that keep your business consistent everywhere."]
    - ["How long does a brand identity take?", "The first full brand board arrives within 48 hours. Basic and Premium Branding are completed in 2 days, and The Brand Ecosystem in 5 business days."]
    - ["Do I get brand guidelines?", "Yes. Every package includes brand guidelines, and Premium Branding and The Brand Ecosystem include complete guidelines with logo usage, colour, type and imagery rules."]
    - ["Do you work with clients outside Pakistan?", "Yes. I work remotely with founders in the USA, UK, Canada, Australia and the UAE, by call, email and WhatsApp."]
    - ["Can I get a custom quote?", "Yes. If your project doesn't fit a package, book a call or send a message and I'll put together a custom quote."]
