# Extra depth for the industry pages (/branding/<slug>/), merged in by tools/pages.py.
# who: who the page is for. deliver: what the identity covers in this industry.
# faqs: added after the FAQs in industries.yaml. posts: related blog slugs.
beauty-wellness:
  meta: "Human-designed brand identities for skincare, beauty, spa and wellness brands: logo, packaging, guidelines and social kit. First board in 48 hours."
  who: [Skincare and cosmetics lines, Med spas and beauty salons, Pilates and wellness studios, Wellness apps and platforms, Perfume and body-care brands]
  deliver: >-
    For beauty and wellness brands the identity has to work on small labels, frosted bottles and
    Instagram grids at once. I design the logo system, a restrained colour palette, elegant typography
    and packaging-ready layouts, then test them on 3D product mockups so you see the brand on the shelf
    before you print.
  faqs:
    - ["How much does skincare branding cost?", "Packages start at $250 for a logo with colours, type, mockups and guidelines. Most skincare founders choose Premium Branding ($450) for three directions and a social kit, or The Brand Ecosystem ($1,050) when packaging is needed."]
    - ["Can you follow cosmetic labelling rules?", "I design the label layout and leave space for the required information. The exact wording and claims should be checked against the rules in your market; my skincare guide covers the US and UK basics."]
  posts: [skincare-brand-identity, brand-identity-checklist]
  services: [brand-identity-design, logo-design, pricing]
food-drink:
  meta: "Human-designed branding for cafés, restaurants, breweries and food & drink products: logo, packaging, menus and social. First brand board in 48 hours."
  who: [Cafés and coffee shops, Restaurants and fast food, Breweries and beverage brands, Bakeries and dessert shops, Packaged food and snack brands]
  deliver: >-
    Food brands live on cups, bags, menus, signage and delivery apps. I design bold, readable logos,
    a colour palette with personality, menu and social templates, and packaging mockups, so the brand
    looks right on a sticker, a shopfront and a phone screen.
  faqs:
    - ["How much does restaurant or café branding cost?", "Packages start at $250. Most new cafés and restaurants choose Premium Branding ($450) for three logo directions and a social kit; The Brand Ecosystem ($1,050) adds packaging and merchandise."]
    - ["Can you design a mascot or pattern for my food brand?", "Yes. Patterns and graphic elements are part of the identity system, and The Brand Ecosystem includes pattern and icon assets."]
  posts: [brand-identity-checklist, how-much-does-a-logo-cost]
  services: [logo-design, brand-identity-design, pricing]
tech-fintech:
  meta: "Human-designed brand identities for tech, SaaS, AI and fintech startups: logo systems, UI-ready assets, guidelines and launch creatives. From $250."
  who: [SaaS and AI startups, Fintech and payments companies, Apps and digital products, Tech studios and agencies, Logistics and B2B platforms]
  deliver: >-
    Tech brands must be legible as an app icon, sharp in product UI and convincing on a pitch deck.
    I design wordmarks and monograms built on a grid, a focused colour system, type that works in
    interfaces, and UI-ready brand assets, then show the identity on devices, social posts and
    launch creatives.
  faqs:
    - ["How much does startup or SaaS branding cost?", "Packages start at $250. Most startups choose Premium Branding ($450); The Brand Ecosystem ($1,050) adds UI branding assets, ad creatives and marketing angles for launch."]
    - ["Can my brand work inside the app or product?", "Yes. The identity is designed to work in UI, and The Brand Ecosystem includes pattern, icon and UI branding assets."]
  posts: [brand-identity-checklist, logo-file-formats]
  services: [startup-branding, brand-identity-design, logo-design]
