beauty-wellness:
  meta: 'Human-designed brand identities for skincare, beauty, spa and wellness brands: logo, packaging, guidelines and social kit. First board in 48 hours.'
  who:
  - Skincare and cosmetics lines
  - Med spas and beauty salons
  - Pilates and wellness studios
  - Wellness apps and platforms
  - Perfume and body-care brands
  deliver: For beauty and wellness brands the identity has to work on small labels, frosted bottles and Instagram grids at once. I design the logo system, a restrained colour palette, elegant typography and packaging-ready layouts, then test them on 3D product mockups so you see the brand on the shelf before you print.
  faqs:
  - - How much does skincare branding cost?
    - Packages start at $250 for a logo with colours, type, mockups and guidelines. Most skincare founders choose Premium Branding ($450) for three directions and a social kit, or The Brand Ecosystem ($1,050) when packaging is needed.
  - - Can you follow cosmetic labelling rules?
    - I design the label layout and leave space for the required information. The exact wording and claims should be checked against the rules in your market; my skincare guide covers the US and UK basics.
  posts:
  - skincare-brand-identity
  - brand-identity-checklist
  services:
  - brand-identity-design
  - logo-design
  - pricing
  sections:
  - h2: Beauty branding by business type
    table:
    - - Business
      - What matters most
      - Typical package
    - - Skincare and cosmetics line
      - Packaging system, small-label legibility, shelf impact
      - The Brand Ecosystem ($1,050)
    - - Med spa or clinic
      - Calm, clinical trust with a premium feel
      - Premium ($450)
    - - Salon, lash or nail studio
      - Instagram grid, gift cards, signage
      - Premium ($450)
    - - Pilates or wellness studio
      - Class schedules, merch, app or booking pages
      - Premium or Brand Ecosystem
    - - Perfume and body care
      - Bottle, box and luxury details
      - The Brand Ecosystem ($1,050)
  - h2: Common beauty branding mistakes
    ul:
    - Pastel palettes that disappear on white packaging and in bright light
    - Thin script logos that blur on small labels and embroidery
    - Copying the look of a market leader, so customers confuse you with them
    - No rules for photography, so the Instagram grid looks like five different brands
