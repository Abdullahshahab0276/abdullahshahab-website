tech-fintech:
  meta: 'Human-designed brand identities for tech, SaaS, AI and fintech startups: logo systems, UI-ready assets, guidelines and launch creatives. From $250.'
  who:
  - SaaS and AI startups
  - Fintech and payments companies
  - Apps and digital products
  - Tech studios and agencies
  - Logistics and B2B platforms
  deliver: Tech brands must be legible as an app icon, sharp in product UI and convincing on a pitch deck. I design wordmarks and monograms built on a grid, a focused colour system, type that works in interfaces, and UI-ready brand assets, then show the identity on devices, social posts and launch creatives.
  faqs:
  - - How much does startup or SaaS branding cost?
    - Packages start at $250. Most startups choose Premium Branding ($450); The Brand Ecosystem ($1,050) adds UI branding assets, ad creatives and marketing angles for launch.
  - - Can my brand work inside the app or product?
    - Yes. The identity is designed to work in UI, and The Brand Ecosystem includes pattern, icon and UI branding assets.
  posts:
  - brand-identity-checklist
  - logo-file-formats
  services:
  - startup-branding
  - brand-identity-design
  - logo-design
  sections:
  - h2: What tech and fintech brands need
    table:
    - - Need
      - Why
      - What I deliver
    - - App icon
      - The logo is often seen at 60 pixels first
      - Icon tested on iOS and Android home screens
    - - Trust signals
      - Money and data products must feel safe
      - Calm palettes, solid typography, no gimmicks
    - - UI handoff
      - Developers need tokens, not just a PDF
      - Colour and type specs, icons and UI assets (Brand Ecosystem)
    - - Pitch deck
      - Investors judge polish
      - Deck-ready logo versions and slide styling
  - h2: Tech branding mistakes to avoid
    ul:
    - A gradient or 3D logo that falls apart as a favicon
    - Copying the visual language of a big competitor
    - Brand colours with poor contrast for accessible UI
    - No dark-mode version of the logo
